name: Nightly Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: write

jobs:
  nightly:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web frontend
        working-directory: web
        run: npm run build

      - name: Build server
        run: dotnet publish server -c Release --nologo -v q

      - name: Get short SHA
        id: sha
        shell: pwsh
        run: |
          $sha = git rev-parse --short HEAD
          echo "short=$sha" >> $env:GITHUB_OUTPUT

      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $token = "${{ secrets.GITHUB_TOKEN }}"
          $headers = @{ Authorization = "Bearer $token"; "Accept" = "application/vnd.github+json" }
          $repo = "${{ github.repository }}"
          $tag = "N-${{ steps.sha.outputs.short }}"
          $zipFile = "CuBlocky-$tag.zip"
          $publishDir = "server/bin/Release/net9.0/win-x64/publish"

          if (-not (Test-Path $publishDir)) {
            Write-Host "Publish dir not found: $publishDir"
            Get-ChildItem "server/bin/Release" -Recurse -Directory | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          $missing = @('Launch.cmd', 'README.md')
          foreach ($f in $missing) {
            if (-not (Test-Path $f)) {
              Write-Host "Required file for the zip is missing: $f"
              exit 1
            }
          }

          # A release for this exact SHA means this commit is already published.
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers
          } catch {
            $code = $null
            try { $code = [int]$_.Exception.Response.StatusCode } catch { }
            if ($code -ne 404) { throw }
          }
          if ($existing) {
            $have = $false
            foreach ($a in $existing.assets) { if ($a.name -eq $zipFile) { $have = $true } }
            if ($have) {
              Write-Host "Release $tag already has $zipFile, nothing to do."
              exit 0
            }
            Write-Host "Release $tag exists but the asset is missing."
          }

          Copy-Item "Launch.cmd" "$publishDir/"
          Copy-Item "README.md" "$publishDir/"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipFile -Force

          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $zipFile).Path)

          if ($existing) {
            $uploadUrl = $existing.upload_url -replace "\{\?name,label\}", "?name=$zipFile"
            Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $headers -ContentType "application/zip" -Body $bytes
            Write-Host "Uploaded $zipFile to existing release $tag"
            exit 0
          }

          $body = @{
            tag_name    = $tag
            name        = $tag
            prerelease = $true
            body        = "This is a night build version, which may be somewhat unstable and has not been fully tested. You can try out the latest exciting features."
          } | ConvertTo-Json

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" `
            -Method Post -Headers $headers -ContentType "application/json" -Body $body

          $uploadUrl = $release.upload_url -replace "\{\?name,label\}", "?name=$zipFile"
          Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $headers -ContentType "application/zip" -Body $bytes

          Write-Host "Published $tag (release id: $($release.id))"
